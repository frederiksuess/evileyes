<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Feueraugen · Kamera</title>
<link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sender.css">
<script type="module" src="js/sender.js"></script>
</head>
<body class="sender">
<main id="senderSeite">
  <h1>Feueraugen</h1>
  <p class="untertitel">Dieses Handy wird zur Kamera</p>

  <div class="vorschau-rahmen">
    <video id="eigenesBild" playsinline muted autoplay></video>
    <div id="keinBild">Noch keine Kamera</div>
  </div>

  <p id="senderStatus" role="status" aria-live="polite">Bereit.</p>

  <div class="segment" role="group" aria-label="Kamera">
    <button data-kamera="environment" aria-pressed="true">Rückkamera</button>
    <button data-kamera="user" aria-pressed="false">Frontkamera</button>
  </div>

  <button class="knopf" id="senden">Kamera starten</button>
  <button class="klein" id="dunkel" disabled>Bildschirm abdunkeln</button>

  <p class="tipp">Handy so ausrichten, dass der Bereich vor dem Portal im Bild ist, und ans Ladekabel hängen.
    Die Rückkamera ist bei wenig Licht meist deutlich besser.</p>
</main>
<div id="schwarz" hidden><span id="schwarzStatus"></span></div>
</body>
</html>
