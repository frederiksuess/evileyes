<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Feueraugen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: #000000;
    --ember: #f08a24;
    --ember-hot: #ffc163;
    --bone: #e4d9cb;
    --ash: #8f8277;
    --sheet: rgba(22, 17, 14, 0.9);
    --line: rgba(240, 138, 36, 0.28);
    --title-font: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
    --ui-font: "Alegreya Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Die Bühne bleibt in beiden Modi schwarz – das Bild lebt davon. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage: #000000; --bone: #e4d9cb; --ash: #8f8277; --sheet: rgba(22, 17, 14, 0.9);
    }
  }
  :root[data-theme="dark"] {
    --stage: #000000; --bone: #e4d9cb; --ash: #8f8277; --sheet: rgba(22, 17, 14, 0.9);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--stage); color: var(--bone);
    font-family: var(--ui-font); font-size: 17px; line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas#buehne { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Startbildschirm */
  #start {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding: 0 28px calc(44px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to bottom, rgba(0,0,0,0) 35%, rgba(0,0,0,0.82) 62%, #000 100%);
    text-align: center;
    transition: opacity 0.6s ease;
  }
  #start.weg { opacity: 0; pointer-events: none; }
  #start h1 {
    font-family: var(--title-font); font-weight: 500;
    font-size: clamp(52px, 17vw, 84px); line-height: 0.95; margin: 0 0 14px;
    color: var(--ember-hot);
    text-shadow: 0 0 18px rgba(240, 120, 20, 0.65), 0 0 46px rgba(200, 60, 0, 0.45);
  }
  #start p { margin: 0 0 26px; max-width: 30ch; color: var(--bone); }
  .knopf {
    font: 700 18px/1 var(--ui-font); color: #1a0d03;
    background: var(--ember); border: 0; border-radius: 999px;
    padding: 17px 30px; min-width: 240px; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255, 193, 99, 0.5), 0 8px 30px rgba(240, 110, 20, 0.35);
  }
  .knopf:focus-visible, .klein:focus-visible { outline: 2px solid var(--ember-hot); outline-offset: 3px; }
  .leise {
    margin-top: 14px; background: none; border: 0; color: var(--ash);
    font: 500 16px var(--ui-font); padding: 10px 14px; cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* Hinweiszeile oben */
  #hinweis {
    position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 6;
    transform: translateX(-50%);
    max-width: calc(100% - 32px); padding: 9px 16px; border-radius: 12px;
    background: var(--sheet); border: 1px solid var(--line); color: var(--bone);
    font-size: 15px; text-align: center;
    opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
  }
  #hinweis.an { opacity: 1; }

  /* Einstellungen (erscheinen nach Antippen) */
  #leiste {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--sheet); border-top: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transform: translateY(105%); transition: transform 0.3s ease;
  }
  #leiste.offen { transform: translateY(0); }
  .reihe { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 520px; margin: 0 auto; }
  .reihe + .reihe { margin-top: 12px; }
  .klein {
    font: 500 16px var(--ui-font); color: var(--bone);
    background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 15px; cursor: pointer; min-height: 44px;
  }
  .klein[aria-pressed="true"] { color: #1a0d03; background: var(--ember); border-color: var(--ember); }
  .regler { display: flex; align-items: center; gap: 12px; color: var(--ash); font-size: 15px; }
  .regler input { width: 150px; accent-color: var(--ember); }

  #vorschau {
    position: fixed; z-index: 3; left: 12px; top: calc(12px + env(safe-area-inset-top, 0px));
    width: 132px; height: 99px; image-rendering: pixelated;
    border: 1px solid var(--line); border-radius: 8px; display: none;
  }
  #vorschau.an { display: block; }

  @media (prefers-reduced-motion: reduce) {
    #start, #leiste, #hinweis { transition: none; }
  }
</style>
</head>
<body>
<canvas id="buehne" aria-label="Zwei glühende Augen, die der Bewegung vor der Kamera folgen"></canvas>
<canvas id="vorschau" width="96" height="72" aria-hidden="true"></canvas>
<video id="video" playsinline muted autoplay hidden></video>

<div id="start">
  <h1>Feueraugen</h1>
  <p>Stell das Handy hin, Bildschirm zum Raum. Die Augen folgen jeder Bewegung vor der Frontkamera.</p>
  <button class="knopf" id="losKamera">Kamera starten</button>
  <button class="leise" id="losFinger">Ohne Kamera – Augen folgen dem Finger</button>
</div>

<div id="hinweis" role="status" aria-live="polite"></div>

<div id="leiste" aria-hidden="true">
  <div class="reihe">
    <button class="klein" id="bSpiegeln" aria-pressed="true">Spiegeln</button>
    <button class="klein" id="bVorschau" aria-pressed="false">Kamerabild</button>
    <button class="klein" id="bNeu">Hintergrund neu lernen</button>
    <button class="klein" id="bVoll">Vollbild</button>
  </div>
  <div class="reihe">
    <label class="regler">Empfindlichkeit
      <input type="range" id="rEmpf" min="6" max="60" value="34">
    </label>
  </div>
</div>

// ---------- Bilder laden ----------
function bild(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

const buehne = document.getElementById('buehne');
const ctx = buehne.getContext('2d');
const ebene = document.createElement('canvas');
ebene.width = A.w; ebene.height = A.h;
const ectx = ebene.getContext('2d');

let IMG = null;

// ---------- Blick-Zustand ----------
let ox = 0, oy = 0, glut = 0;
let ziel = null, zielZeit = 0, aktivitaet = 0;
let finger = null;            // {x,y} normiert -1..1, solange gezogen wird
let spiegeln = true;
let idle = { x: 0, y: 0 }, naechsterIdle = 0;

function groesse() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  buehne.width = Math.round(innerWidth * dpr);
  buehne.height = Math.round(innerHeight * dpr);
}
addEventListener('resize', groesse);
groesse();

function zeichne(t) {
  if (!IMG) return;
  const W = buehne.width, H = buehne.height;
  const s = Math.min(W / A.w, H / A.h);
  const dw = A.w * s, dh = A.h * s, dx = (W - dw) / 2, dy = (H - dh) / 2;

  // Iris-Ebene: Iris verschieben, dann mit Augenöffnung maskieren
  ectx.globalCompositeOperation = 'source-over';
  ectx.globalAlpha = 1;
  ectx.clearRect(0, 0, A.w, A.h);
  let fx = ox, fy = oy;
  const n = Math.hypot(fx, fy);
  if (n > 1) { fx /= n; fy /= n; }
  const px = fx * A.maxX, py = fy * A.maxY;
  const flacker = 0.06 * (Math.sin(t * 0.0073) * 0.5 + Math.sin(t * 0.0131) * 0.5);
  const g = Math.max(0, Math.min(1, glut * 0.8 + flacker));
  A.iris.forEach((ir, i) => {
    ectx.globalCompositeOperation = 'source-over';
    ectx.globalAlpha = 1;
    ectx.drawImage(IMG.iris[i], ir.x + px, ir.y + py);
    if (g > 0.01) {
      ectx.globalCompositeOperation = 'lighter';
      ectx.globalAlpha = g * 0.45;
      ectx.drawImage(IMG.iris[i], ir.x + px, ir.y + py);
    }
  });
  ectx.globalAlpha = 1;
  ectx.globalCompositeOperation = 'destination-in';
  ectx.drawImage(IMG.mask, 0, 0);
  ectx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(IMG.bg, dx, dy, dw, dh);
  ctx.drawImage(ebene, dx, dy, dw, dh);
  ctx.drawImage(IMG.shadow, dx, dy, dw, dh);
}

let tAlt = performance.now();
function schleife(t) {
  const dt = Math.min(0.1, (t - tAlt) / 1000);
  tAlt = t;

  let zx, zy, tempo;
  if (finger) {
    zx = finger.x; zy = finger.y; tempo = 14;
  } else if (ziel && (t - zielZeit) < 2000) {
    zx = (ziel.x - 0.5) * 2; zy = (ziel.y - 0.5) * 2;
    if (spiegeln) zx = -zx;
    zx = Math.max(-1, Math.min(1, zx * 1.3));
    zy = Math.max(-1, Math.min(1, zy * 1.3));
    tempo = 10;
  } else {
    if (t > naechsterIdle) {
      idle = Math.random() < 0.5 ? { x: 0, y: 0 }
           : { x: (Math.random() * 1.6 - 0.8), y: (Math.random() * 0.8 - 0.4) };
      naechsterIdle = t + 1500 + Math.random() * 3000;
    }
    zx = idle.x; zy = idle.y; tempo = 6;
  }
  const k = 1 - Math.exp(-tempo * dt);
  ox += (zx - ox) * k;
  oy += (zy - oy) * k;
  const akt = finger ? 0.5 : aktivitaet;
  glut += (akt - glut) * (1 - Math.exp(-3 * dt));

  zeichne(t);
  requestAnimationFrame(schleife);
}

// ---------- Bewegungserkennung ----------
const video = document.getElementById('video');
const PW = 96, PH = 72;
const proc = document.createElement('canvas');
proc.width = PW; proc.height = PH;
const pctx = proc.getContext('2d', { willReadFrequently: true });
const vorschau = document.getElementById('vorschau');
const vctx = vorschau.getContext('2d');
const vorschauBild = vctx.createImageData(PW, PH);

let hg = null, lernen = 0, schwelle = 26;
const aktuell = new Float32Array(PW * PH);
const bewegt = new Uint8Array(PW * PH);
let kameraLaeuft = false;

function neuLernen() { lernen = 12; }

function analysiere() {
  if (!kameraLaeuft) return;
  if (video.readyState >= 2) {
    pctx.drawImage(video, 0, 0, PW, PH);
    const d = pctx.getImageData(0, 0, PW, PH).data;
    for (let i = 0, p = 0; i < aktuell.length; i++, p += 4)
      aktuell[i] = d[p] * 0.299 + d[p + 1] * 0.587 + d[p + 2] * 0.114;

    if (!hg) { hg = new Float32Array(aktuell); lernen = 12; }

    let roh = 0;
    for (let i = 0; i < aktuell.length; i++) {
      const b = Math.abs(aktuell[i] - hg[i]) > schwelle ? 1 : 0;
      bewegt[i] = b; roh += b;
    }

    if (lernen > 0) {
      lernen--;
      hg.set(aktuell);
    } else if (roh > aktuell.length * 0.55) {
      // Licht hat sich geändert oder das Handy wurde bewegt
      hg.set(aktuell);
    } else {
      // Nur Pixel zählen, deren Nachbarn sich auch bewegen (Rauschen raus)
      let sx = 0, n = 0;
      const zeilen = new Uint16Array(PH);
      for (let y = 1; y < PH - 1; y++) {
        for (let x = 1; x < PW - 1; x++) {
          const i = y * PW + x;
          if (!bewegt[i]) continue;
          const nb = bewegt[i - 1] + bewegt[i + 1] + bewegt[i - PW] + bewegt[i + PW];
          if (nb >= 3) { sx += x; n++; zeilen[y]++; }
        }
      }
      if (n > PW * PH * 0.006) {
        // obere Kante der Bewegung ~ Kopf / Oberkörper
        let summe = 0, yz = 0;
        for (let y = 0; y < PH; y++) { summe += zeilen[y]; if (summe >= n * 0.25) { yz = y; break; } }
        ziel = { x: sx / n / PW, y: yz / PH };
        zielZeit = performance.now();
        aktivitaet = Math.min(1, (n / (PW * PH)) * 6);
      } else {
        aktivitaet *= 0.9;
      }
      // Hintergrund langsam nachführen; bewegte Stellen nur sehr langsam
      for (let i = 0; i < hg.length; i++)
        hg[i] += (aktuell[i] - hg[i]) * (bewegt[i] ? 0.004 : 0.05);
    }

    if (vorschau.classList.contains('an')) {
      const o = vorschauBild.data;
      for (let i = 0, p = 0; i < aktuell.length; i++, p += 4) {
        const v = aktuell[i];
        o[p] = bewegt[i] ? 255 : v; o[p + 1] = bewegt[i] ? 120 : v; o[p + 2] = bewegt[i] ? 20 : v; o[p + 3] = 255;
      }
      vctx.putImageData(vorschauBild, 0, 0);
      if (ziel && performance.now() - zielZeit < 300) {
        vctx.fillStyle = '#ff2a00';
        vctx.fillRect(Math.round(ziel.x * PW) - 2, Math.round(ziel.y * PH) - 2, 4, 4);
      }
    }
  }
  setTimeout(analysiere, 66); // ~15 Analysen pro Sekunde reichen völlig
}

async function kameraStarten() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('nicht unterstützt');
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 30 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play().catch(() => {});
  kameraLaeuft = true;
  hg = null;
  analysiere();
}

// ---------- Bildschirm wach halten ----------
let wachSperre = null;
async function wachHalten() {
  try { if ('wakeLock' in navigator) wachSperre = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (kameraLaeuft || gestartet)) wachHalten();
});

// ---------- Hinweise ----------
const hinweis = document.getElementById('hinweis');
let hinweisTimer = null;
function zeige(text, ms = 3200) {
  hinweis.textContent = text;
  hinweis.classList.add('an');
  clearTimeout(hinweisTimer);
  hinweisTimer = setTimeout(() => hinweis.classList.remove('an'), ms);
}

// ---------- Start ----------
const start = document.getElementById('start');
let gestartet = false;

async function vollbild() {
  const el = document.documentElement;
  try {
    if (!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
    else if (document.fullscreenElement) await document.exitFullscreen();
  } catch (e) { zeige('Vollbild ist hier nicht verfügbar.'); }
}

async function los(mitKamera) {
  gestartet = true;
  start.classList.add('weg');
  wachHalten();
  if (mitKamera) {
    try {
      await kameraStarten();
      zeige('Kurz stillhalten – der Hintergrund wird gelernt.');
    } catch (e) {
      const grund = (e && e.name === 'NotAllowedError')
        ? 'Kamerazugriff wurde verweigert.'
        : 'Die Kamera ist hier nicht erreichbar.';
      zeige(grund + ' Die Augen folgen jetzt deinem Finger.', 6000);
    }
  } else {
    zeige('Zieh den Finger über den Bildschirm.');
  }
}
document.getElementById('losKamera').addEventListener('click', () => los(true));
document.getElementById('losFinger').addEventListener('click', () => los(false));

// ---------- Berührung: ziehen = Augen führen, tippen = Einstellungen ----------
const leiste = document.getElementById('leiste');
let leisteTimer = null;
function leisteZeigen(an) {
  leiste.classList.toggle('offen', an);
  leiste.setAttribute('aria-hidden', an ? 'false' : 'true');
  clearTimeout(leisteTimer);
  if (an) leisteTimer = setTimeout(() => leisteZeigen(false), 6000);
}
leiste.addEventListener('pointerdown', e => { e.stopPropagation(); leisteZeigen(true); });

let down = null;
function fingerPos(e) {
  return {
    x: Math.max(-1, Math.min(1, (e.clientX / innerWidth - 0.5) * 2.4)),
    y: Math.max(-1, Math.min(1, (e.clientY / innerHeight - 0.5) * 3))
  };
}
buehne.addEventListener('pointerdown', e => {
  if (!gestartet) return;
  down = { x: e.clientX, y: e.clientY, gezogen: false };
  buehne.setPointerCapture(e.pointerId);
});
buehne.addEventListener('pointermove', e => {
  if (!down) return;
  if (!down.gezogen && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) down.gezogen = true;
  if (down.gezogen) finger = fingerPos(e);
});
function loslassen() {
  if (down && !down.gezogen) leisteZeigen(!leiste.classList.contains('offen'));
  down = null; finger = null;
}
buehne.addEventListener('pointerup', loslassen);
buehne.addEventListener('pointercancel', () => { down = null; finger = null; });

// ---------- Einstellungen ----------
const bSpiegeln = document.getElementById('bSpiegeln');
bSpiegeln.addEventListener('click', () => {
  spiegeln = !spiegeln;
  bSpiegeln.setAttribute('aria-pressed', String(spiegeln));
  zeige(spiegeln ? 'Spiegeln an' : 'Spiegeln aus', 1400);
});
const bVorschau = document.getElementById('bVorschau');
bVorschau.addEventListener('click', () => {
  const an = !vorschau.classList.contains('an');
  vorschau.classList.toggle('an', an);
  bVorschau.setAttribute('aria-pressed', String(an));
  if (an && !kameraLaeuft) zeige('Die Kamera ist nicht aktiv.', 2000);
});
document.getElementById('bNeu').addEventListener('click', () => { neuLernen(); zeige('Kurz stillhalten …', 1800); });
document.getElementById('bVoll').addEventListener('click', vollbild);
const rEmpf = document.getElementById('rEmpf');
function setEmpf() { schwelle = 66 - Number(rEmpf.value); }
rEmpf.addEventListener('input', setEmpf);
setEmpf();

// ---------- Los geht’s ----------
Promise.all([bild(A.bg), bild(A.mask), bild(A.shadow), ...A.iris.map(i => bild(i.src))]).then(([bg, mask, shadow, ...iris]) => {
  IMG = { bg, mask, shadow, iris };
  requestAnimationFrame(schleife);
});
</script>
</body>
