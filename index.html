<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Feueraugen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: #000000;
    --ember: #f08a24;
    --ember-hot: #ffc163;
    --bone: #e4d9cb;
    --ash: #8f8277;
    --sheet: rgba(22, 17, 14, 0.92);
    --line: rgba(240, 138, 36, 0.28);
    --title-font: "Grenze Gotisch", Georgia, serif;
    --ui-font: "Alegreya Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Die Bühne bleibt in beiden Modi schwarz – das Bild lebt davon. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --stage: #000000; --bone: #e4d9cb; --ash: #8f8277; --sheet: rgba(22, 17, 14, 0.92); }
  }
  :root[data-theme="dark"] { --stage: #000000; --bone: #e4d9cb; --ash: #8f8277; --sheet: rgba(22, 17, 14, 0.92); }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--stage); color: var(--bone);
    font-family: var(--ui-font); font-size: 17px; line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas#buehne { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #start {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding: 0 28px calc(44px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to bottom, rgba(0,0,0,0) 35%, rgba(0,0,0,0.82) 62%, #000 100%);
    text-align: center; transition: opacity 0.6s ease;
  }
  #start.weg { opacity: 0; pointer-events: none; }
  #start h1 {
    font-family: var(--title-font); font-weight: 500;
    font-size: clamp(52px, 17vw, 84px); line-height: 0.95; margin: 0 0 14px;
    color: var(--ember-hot);
    text-shadow: 0 0 18px rgba(240, 120, 20, 0.65), 0 0 46px rgba(200, 60, 0, 0.45);
  }
  #start p { margin: 0 0 26px; max-width: 30ch; }
  .knopf {
    font: 700 18px/1 var(--ui-font); color: #1a0d03;
    background: var(--ember); border: 0; border-radius: 999px;
    padding: 17px 30px; min-width: 240px; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255, 193, 99, 0.5), 0 8px 30px rgba(240, 110, 20, 0.35);
  }
  .knopf:focus-visible, .klein:focus-visible, .leise:focus-visible, input:focus-visible {
    outline: 2px solid var(--ember-hot); outline-offset: 3px;
  }
  .leise {
    margin-top: 14px; background: none; border: 0; color: var(--ash);
    font: 500 16px var(--ui-font); padding: 10px 14px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }

  #hinweis {
    position: fixed; left: 0; right: 0; top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 6;
    margin: 0 auto; width: fit-content; max-width: min(560px, calc(100% - 32px)); padding: 9px 16px; border-radius: 12px;
    background: var(--sheet); border: 1px solid var(--line);
    font-size: 15px; text-align: center;
    opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
  }
  #hinweis.an { opacity: 1; }

  #leiste {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
    max-height: 72%; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--sheet); border-top: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transform: translateY(105%); transition: transform 0.3s ease;
  }
  #leiste.offen { transform: translateY(0); }
  .innen { max-width: 540px; margin: 0 auto; }
  .reihe { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .reihe + .reihe, .regler-gruppe { margin-top: 10px; }
  .klein {
    font: 500 16px var(--ui-font); color: var(--bone);
    background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; cursor: pointer; min-height: 44px;
  }
  .klein[aria-pressed="true"] { color: #1a0d03; background: var(--ember); border-color: var(--ember); }
  .regler-gruppe { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; }
  .regler-gruppe label { color: var(--ash); font-size: 15px; }
  .regler-gruppe input { width: 100%; accent-color: var(--ember); min-height: 32px; touch-action: pan-x; }
  .regler-gruppe output { font-size: 15px; min-width: 4ch; text-align: right; color: var(--bone); }
  .zeile-unten { display: flex; justify-content: center; margin-top: 8px; }
  .zeile-unten .leise { margin: 0; font-size: 15px; }

  #vorschauBox {
    position: fixed; z-index: 3; left: 12px; top: calc(12px + env(safe-area-inset-top, 0px));
    display: none; font-size: 13px; color: var(--bone);
  }
  #vorschauBox.an { display: block; }
  #vorschau {
    display: block; width: 144px; height: 108px; image-rendering: pixelated;
    border: 1px solid var(--line); border-radius: 8px;
  }
  #vorschauInfo { margin-top: 4px; text-shadow: 0 1px 2px #000; }

  /* Spinnenjagd */
  #hud {
    position: fixed; left: 0; right: 0; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 6;
    display: flex; justify-content: space-between; padding: 0 16px; pointer-events: none;
  }
  #hud[hidden], #countdown[hidden], #ergebnis[hidden] { display: none; }
  .hud-feld {
    display: flex; flex-direction: column; align-items: center; min-width: 84px;
    padding: 6px 14px 8px; border-radius: 14px;
    background: var(--sheet); border: 1px solid var(--line);
  }
  .hud-feld span {
    font-family: var(--title-font); font-size: 40px; line-height: 1; color: var(--ember-hot);
    text-shadow: 0 0 14px rgba(240, 120, 20, 0.6); font-variant-numeric: tabular-nums;
  }
  .hud-feld small { font-size: 13px; color: var(--ash); }
  .hud-feld.knapp span { color: #ff5a3c; }
  #countdown {
    position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
    pointer-events: none; text-align: center;
    font-family: var(--title-font); font-size: clamp(64px, 26vw, 180px); line-height: 1;
    color: var(--ember-hot);
    text-shadow: 0 0 24px rgba(240, 120, 20, 0.75), 0 0 70px rgba(200, 60, 0, 0.5);
  }
  #countdown.text { font-size: clamp(48px, 15vw, 110px); }
  #ergebnis {
    position: fixed; inset: 0; z-index: 7;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: rgba(0, 0, 0, 0.72);
  }
  #ergebnis h2 { font-family: var(--title-font); font-weight: 500; font-size: clamp(36px, 11vw, 60px); margin: 0; color: var(--bone); }
  #eZahl {
    font-family: var(--title-font); font-size: clamp(96px, 34vw, 200px); line-height: 1; margin: 8px 0 0;
    color: var(--ember-hot); text-shadow: 0 0 30px rgba(240, 120, 20, 0.7);
  }
  #eText { margin: 4px 0 28px; max-width: 32ch; color: var(--bone); }

  @media (prefers-reduced-motion: reduce) {
    #start, #leiste, #hinweis { transition: none; }
  }
</style>
</head>
<body>
<canvas id="buehne" aria-label="Zwei glühende Augen, die der Bewegung vor der Kamera folgen"></canvas>
<div id="vorschauBox" aria-hidden="true">
  <canvas id="vorschau" width="96" height="72"></canvas>
  <div id="vorschauInfo"></div>
</div>
<video id="video" playsinline muted autoplay hidden></video>

<div id="start">
  <h1>Feueraugen</h1>
  <p>Stell das Handy hin, Bildschirm zum Raum. Die Augen folgen jeder Bewegung vor der Frontkamera.</p>
  <button class="knopf" id="losKamera">Kamera starten</button>
  <button class="leise" id="losFinger">Ohne Kamera – Augen folgen dem Finger</button>
</div>

<div id="hinweis" role="status" aria-live="polite"></div>

<div id="hud" hidden>
  <div class="hud-feld"><span id="hPunkte">0</span><small>erwischt</small></div>
  <div class="hud-feld" id="hZeitFeld"><span id="hZeit">30</span><small>Sekunden</small></div>
</div>
<div id="countdown" hidden aria-live="assertive"></div>
<div id="ergebnis" hidden role="dialog" aria-labelledby="eTitel">
  <h2 id="eTitel">Spinnenjagd vorbei</h2>
  <div id="eZahl">0</div>
  <p id="eText"></p>
  <button class="knopf" id="eNochmal">Nochmal spielen</button>
  <button class="leise" id="eZurueck">Zurück zu den Augen</button>
</div>

<div id="leiste" aria-hidden="true">
  <div class="innen">
    <div class="reihe">
      <button class="klein" id="bMehrere" aria-pressed="true">Mehrere Personen</button>
      <button class="klein" id="bSpiegeln" aria-pressed="true">Spiegeln</button>
      <button class="klein" id="bVorschau" aria-pressed="false">Kamerabild</button>
    </div>
    <div class="reihe">
      <button class="klein" id="bBlinzeln">Blinzeln</button>
      <button class="klein" id="bMotiv">Anderes Motiv</button>
      <button class="klein" id="bNeu">Hintergrund neu lernen</button>
      <button class="klein" id="bVoll">Vollbild</button>
    </div>
    <div class="regler-gruppe">
      <label for="rZoom">Augengröße</label>
      <input type="range" id="rZoom" min="50" max="300" step="1" value="100">
      <output id="oZoom" for="rZoom">100 %</output>
      <label for="rHoehe">Höhe</label>
      <input type="range" id="rHoehe" min="-100" max="100" step="1" value="0">
      <output id="oHoehe" for="rHoehe">0</output>
      <label for="rEmpf">Empfindlichkeit</label>
      <input type="range" id="rEmpf" min="6" max="60" value="34">
      <output id="oEmpf" for="rEmpf">34</output>
    </div>
    <div class="zeile-unten">
      <button class="leise" id="bReset">Größe und Höhe zurücksetzen</button>
    </div>
  </div>
</div>

const S = { motiv: 0, zoom: 1, hoehe: 0, mehrere: true, spiegeln: true, empf: 34, rekord: 0 };
try { Object.assign(S, JSON.parse(localStorage.getItem('feueraugen') || '{}')); } catch (e) {}

function bild(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

// ---------- Leinwände ----------
const buehne = document.getElementById('buehne');
const ctx = buehne.getContext('2d');

const ectx = ebene.getContext('2d');
const lidEbene = document.createElement('canvas');

let M = null, IMG = null;
const GELADEN = [];
function motivSetzen(i) {

  M = A.motive[S.motiv];
  IMG = GELADEN[S.motiv] || null;

// ---------- Zustand der Augen ----------
let ox = 0, oy = 0;         // Blickrichtung -1..1
let glut = 0;               // Aufregung (Leuchten)
let naehe = 0;              // 0 = weit weg, 1 = ganz nah
let pupille = 1;            // Breite des Pupillenschlitzes (relativ)
let finger = null;
let idle = { x: 0, y: 0 }, naechsterIdle = 0;

// ---------- Blinzeln ----------
let blinzel = null;
let naechstesBlinzeln = performance.now() + 2500;
let letzterSchreck = 0;
function blinzeln(doppelt = false, verzoegerung = 0) {
  if (blinzel) return;
  blinzel = { t0: performance.now() + verzoegerung, doppelt };
}
function lidStand(t) {
  if (!blinzel) {
    if (t > naechstesBlinzeln) blinzeln(Math.random() < 0.18);
    else return 0;
  }
  const ZU = 85, HALT = 45, AUF = 160;
  const d = t - blinzel.t0;
  if (d < 0) return 0;
  if (d < ZU) { const x = d / ZU; return x * x * (3 - 2 * x); }
  if (d < ZU + HALT) return 1;
  if (d < ZU + HALT + AUF) { const x = (d - ZU - HALT) / AUF; return (1 - x) * (1 - x); }
  if (blinzel.doppelt) blinzel = { t0: t + 70, doppelt: false };
  else { blinzel = null; naechstesBlinzeln = t + 2500 + Math.random() * 4500; }
  return 0;
}

function lidKurven(e, c) {
  const N = 48, th = e.ang * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);
  const P = (u, v) => [e.cx + u * cs - v * sn, e.cy + u * sn + v * cs];
  const treffen = 0.62;
  const top = [], oben = [], unten = [], bot = [];
  for (let i = 0; i <= N; i++) {
    const u = -e.a - 3 + (2 * e.a + 6) * i / N;
    const k = Math.sqrt(Math.max(0, 1 - (u / e.a) ** 2));
    const vt = -e.b * k, vb = e.b * k;
    const vm = vt + (vb - vt) * treffen;
    top.push(P(u, vt));
    bot.push(P(u, vb));
    oben.push(P(u, vt + (vm + 1.5 - vt) * c));
    unten.push(P(u, vb + (vm - 1.5 - vb) * c));
  }
  return { top, oben, unten, bot, P };
}
function pfad(g, pts) { pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); }

function zeichneLider(c) {
  lctx.clearRect(0, 0, M.w, M.h);
  if (c < 0.01) return false;
  for (const e of M.augen) {
    const K = lidKurven(e, c);
    const H = 2 * e.b + 14;

    lctx.save();
    lctx.beginPath();
    pfad(lctx, K.oben);
    lctx.lineTo(...K.P(e.a + 3, -e.b - H));
    lctx.lineTo(...K.P(-e.a - 3, -e.b - H));
    lctx.closePath();
    lctx.clip();
    for (let i = 0; i < K.oben.length - 1; i++) {
      const [sx, sy] = K.top[i], [dx, dy] = K.oben[i];
      const w = Math.abs(K.oben[i + 1][0] - dx) + 1.5;
      if (M.lidQuelle === 'unten') {
        const [bx, by] = K.bot[i];
        lctx.save();
        lctx.translate(0, dy);
        lctx.scale(1, -1);
        lctx.drawImage(IMG.bg, bx, Math.min(by, M.h - H), w, H, dx, 0, w, H);
        lctx.restore();
      } else {
        lctx.drawImage(IMG.bg, sx, Math.max(0, sy - H), w, H, dx, dy - H, w, H);
      }
    }
    lctx.fillStyle = 'rgba(0,0,0,' + (M.lidDunkel ?? 0.14) + ')';
    lctx.fillRect(0, 0, M.w, M.h);
    lctx.restore();

    lctx.save();
    lctx.beginPath();
    pfad(lctx, K.unten);
    lctx.lineTo(...K.P(e.a + 3, e.b + H));
    lctx.lineTo(...K.P(-e.a - 3, e.b + H));
    lctx.closePath();
    lctx.clip();
    for (let i = 0; i < K.unten.length - 1; i++) {
      const [sx, sy] = K.bot[i], [dx, dy] = K.unten[i];
      const w = Math.abs(K.unten[i + 1][0] - dx) + 1.5;
      lctx.drawImage(IMG.bg, sx, Math.min(sy, M.h - H), w, H, dx, dy, w, H);
    }
    lctx.fillStyle = 'rgba(0,0,0,0.1)';
    lctx.fillRect(0, 0, M.w, M.h);
    lctx.restore();

    const st = Math.min(1, c * 4);
    lctx.save();
    lctx.lineCap = 'round';
    lctx.shadowColor = 'rgba(0,0,0,' + (0.75 * st) + ')';
    lctx.shadowBlur = 7;
    lctx.shadowOffsetY = 3;
    lctx.strokeStyle = 'rgba(12,6,3,' + (0.85 * st) + ')';
    lctx.lineWidth = 2.5;
    lctx.beginPath(); pfad(lctx, K.oben); lctx.stroke();
    lctx.shadowOffsetY = -1;
    lctx.shadowBlur = 4;
    lctx.strokeStyle = 'rgba(12,6,3,' + (0.55 * st) + ')';
    lctx.lineWidth = 1.5;
    lctx.beginPath(); pfad(lctx, K.unten); lctx.stroke();
    lctx.restore();
  }
  lctx.globalCompositeOperation = 'destination-in';
  lctx.drawImage(IMG.lidmask, 0, 0);
  lctx.globalCompositeOperation = 'source-over';
  return true;
}

// Iris mit verstellbarem Pupillenschlitz: das Bild wird links/rechts vom Schlitz
// horizontal gestaucht bzw. gedehnt – wie bei einer echten Schlitzpupille.
function zeichneIris(g, img, ir, x, y, p) {
  const d = img.width, h = img.height;
  const L = ir.pc - ir.ws, R = ir.pc + ir.ws;
  const L2 = ir.pc - ir.ws * p, R2 = ir.pc + ir.ws * p;
  g.drawImage(img, 0, 0, L, h, x, y, L2 + 0.5, h);
  g.drawImage(img, L, 0, R - L, h, x + L2, y, R2 - L2, h);
  g.drawImage(img, R, 0, d - R, h, x + R2 - 0.5, y, d - R2 + 0.5, h);
}

function zeichne(t, lidBasis) {
  if (!IMG) return;
  const W = buehne.width, H = buehne.height;
  const basis = Math.min(W / 600, H / 330);
  const s = basis * S.zoom;
  const dw = M.w * s, dh = M.h * s;
  const dx = W / 2 - M.ex * s;
  const dy = H / 2 - M.ey * s + S.hoehe * H * 0.35;

  ectx.globalCompositeOperation = 'source-over';
  ectx.globalAlpha = 1;
  ectx.clearRect(0, 0, M.w, M.h);
  let fx = ox, fy = oy;
  const n = Math.hypot(fx, fy);
  if (n > 1) { fx /= n; fy /= n; }
  const px = fx * M.maxX, py = fy * M.maxY;
  const flacker = 0.05 * (Math.sin(t * 0.0073) * 0.5 + Math.sin(t * 0.0131) * 0.5);
  const gl = klemm(glut * 0.7 + flacker, 0, 1);
  M.iris.forEach((ir, i) => {
    const x = ir.x + px, y = ir.y + py;
    ectx.globalCompositeOperation = 'source-over';
    ectx.globalAlpha = 1;
    zeichneIris(ectx, IMG.iris[i], ir, x, y, pupille);
    if (gl > 0.01) {
      ectx.globalCompositeOperation = 'lighter';
      ectx.globalAlpha = gl * 0.4;
      zeichneIris(ectx, IMG.iris[i], ir, x, y, pupille);
    }
  });
  ectx.globalAlpha = 1;
  ectx.globalCompositeOperation = 'destination-in';
  ectx.drawImage(IMG.mask, 0, 0);
  ectx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(IMG.bg, dx, dy, dw, dh);
  ctx.drawImage(ebene, dx, dy, dw, dh);
  ctx.drawImage(IMG.shadow, dx, dy, dw, dh);
  const zu = Math.max(lidStand(t), lidBasis);
  if (zeichneLider(zu)) ctx.drawImage(lidEbene, dx, dy, dw, dh);

  // Bildränder sanft ins Schwarz auslaufen lassen
  const fw = dw * 0.07, fh = dh * 0.05;
  let gr = ctx.createLinearGradient(dx, 0, dx + fw, 0);
  gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(dx - 1, dy, fw + 1, dh);
  gr = ctx.createLinearGradient(dx + dw, 0, dx + dw - fw, 0);
  gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(dx + dw - fw, dy, fw + 1, dh);
  gr = ctx.createLinearGradient(0, dy, 0, dy + fh);
  gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(dx, dy - 1, dw, fh + 1);
  gr = ctx.createLinearGradient(0, dy + dh, 0, dy + dh - fh);
  gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(dx, dy + dh - fh, dw, fh + 1);
}

// ---------- Personen verfolgen ----------
// Jede Person ist eine „Spur“, die über mehrere Kamerabilder hinweg wiedererkannt wird.
let spuren = [];
let naechsteId = 1;
let gesamtBewegung = 0;

function spurenAktualisieren(blobs, jetzt) {
  const frei = blobs.slice();
  spuren.sort((a, b) => a.erst - b.erst);
  for (const sp of spuren) {
    let best = -1, bestD = 0.24;
    frei.forEach((b, i) => {
      const d = Math.hypot(b.x - sp.x, (b.y - sp.y) * 0.7);
      if (d < bestD) { bestD = d; best = i; }
    });
    if (best >= 0) {
      const b = frei.splice(best, 1)[0];
      sp.x += (b.x - sp.x) * 0.35;
      sp.y += (b.y - sp.y) * 0.35;
      sp.w += (b.w - sp.w) * 0.2;
      sp.flaeche += (b.flaeche - sp.flaeche) * 0.3;
      sp.box = b.box;
      sp.zuletzt = jetzt;
      sp.treffer++;
    }
  }
  for (const b of frei) {
    spuren.push({ id: naechsteId++, x: b.x, y: b.y, w: b.w, flaeche: b.flaeche, box: b.box,
                  erst: jetzt, zuletzt: jetzt, treffer: 1, gesehen: false });
  }
  spuren = spuren.filter(sp => jetzt - sp.zuletzt < 1200);
}

// ---------- Aufmerksamkeit: wen schauen die Augen an? ----------
let fokusId = null, fokusSeit = 0, naechsterWechsel = 0, zuletztJemand = 0;

function aktiveSpuren(t) {
  return spuren.filter(sp => t - sp.zuletzt < 700 && sp.treffer >= 3);
}
function groesste(liste) { return liste.reduce((a, b) => (b.flaeche > a.flaeche ? b : a)); }

function fokusWaehlen(t) {
  const aktiv = aktiveSpuren(t);
  if (!aktiv.length) { fokusId = null; return null; }
  let akt = aktiv.find(sp => sp.id === fokusId) || null;
  const vorher = fokusId;

  const setze = sp => {
    if (sp.id !== fokusId) { fokusId = sp.id; fokusSeit = t; }
    sp.gesehen = true;
    akt = sp;
  };

  if (!S.mehrere) {
    // Eine Person: an der größten Bewegung festhalten, nur selten wechseln
    if (!akt) setze(groesste(aktiv));
    else {
      const g = groesste(aktiv);
      if (g !== akt && g.flaeche > akt.flaeche * 2.5 && t - fokusSeit > 2500) setze(g);
    }
  } else {
    const verweilt = t - fokusSeit > 1400;   // nie hektisch hin und her springen
    const neu = aktiv.filter(sp => !sp.gesehen && sp.id !== fokusId && sp.flaeche > 0.008);
    if (!akt) {
      setze(neu.length ? neu[0] : groesste(aktiv));
      naechsterWechsel = t + 2500 + Math.random() * 2500;
    } else if (verweilt && neu.length) {
      setze(neu[0]);                          // Neuankömmlinge werden kurz gemustert
      naechsterWechsel = t + 2000 + Math.random() * 2000;
    } else if (verweilt && aktiv.length > 1 && t > naechsterWechsel) {
      const andere = aktiv.filter(sp => sp !== akt);
      const summe = andere.reduce((s, sp) => s + sp.flaeche, 0);
      let r = Math.random() * summe;
      let wahl = andere[0];
      for (const sp of andere) { r -= sp.flaeche; if (r <= 0) { wahl = sp; break; } }
      setze(wahl);
      naechsterWechsel = t + 2500 + Math.random() * 3000;
    }
  }

  // Erschrecken, wenn nach einer Pause wieder jemand auftaucht (höchstens alle 4 s)
  if (vorher === null && t - zuletztJemand > 2500 && t - letzterSchreck > 4000 && Math.random() < 0.65) {
    blinzeln(false, 120);
    letzterSchreck = t;
  }
  zuletztJemand = t;
  return akt;
}

// ---------- Hauptschleife ----------
let tAlt = performance.now();
function schleife(t) {
  const dt = Math.min(0.1, (t - tAlt) / 1000);
  tAlt = t;

  let zx, zy, tempo, zielNaehe = 0;
  const imSpiel = spiel.zustand !== 'aus';
  const fokus = (finger || imSpiel) ? null : fokusWaehlen(t);
  const beute = imSpiel ? spinneImBlick() : null;
  const viele = aktiveSpuren(t).length >= 3;

  if (beute) {
    zx = klemm((beute.x / buehne.width - 0.5) * 2.4, -1, 1);
    zy = klemm((beute.y / buehne.height - 0.5) * 2.4, -1, 1);
    tempo = 7; zielNaehe = 0.15;
  } else if (finger) {
    zx = finger.x; zy = finger.y; tempo = 14; zielNaehe = 0.3;
  } else if (fokus) {
    zx = (fokus.x - 0.5) * 2; zy = (fokus.y - 0.5) * 2;
    if (S.spiegeln) zx = -zx;
    zx = klemm(zx * 1.3, -1, 1);
    zy = klemm(zy * 1.3, -1, 1);
    tempo = viele ? 5 : 8;
    // Breite der Person im Bild ~ Abstand zur Kamera
    zielNaehe = klemm((fokus.w - 0.2) / 0.45, 0, 1);
  } else {
    if (t > naechsterIdle) {
      idle = Math.random() < 0.5 ? { x: 0, y: 0 }
           : { x: Math.random() * 1.6 - 0.8, y: Math.random() * 0.8 - 0.4 };
      naechsterIdle = t + 1500 + Math.random() * 3000;
    }
    zx = idle.x; zy = idle.y; tempo = 6;
  }

  const k = 1 - Math.exp(-tempo * dt);
  ox += (zx - ox) * k;
  oy += (zy - oy) * k;

  // Nähe, Leuchten und Pupille bewusst träge – bleibt ruhig, auch wenn viel los ist
  naehe += (zielNaehe - naehe) * (1 - Math.exp(-dt / (zielNaehe > naehe ? 0.7 : 1.4)));
  const akt = finger ? 0.4 : Math.min(1, gesamtBewegung * 5);
  glut += (akt - glut) * (1 - Math.exp(-dt / 0.6));
  const zielPupille = 1.18 - naehe * 0.6;          // nah: schmaler Schlitz, fern: weiter
  pupille += (zielPupille - pupille) * (1 - Math.exp(-dt / 0.5));

  // Kommt man näher, verengen sich die Augen; geht man weg, öffnen sie sich wieder
  const lidBasis = Math.min(0.45, Math.max(naehe * 0.42, glut * 0.18));

  zeichne(t, lidBasis);
  if (imSpiel) spielSchritt(t, dt);
  requestAnimationFrame(schleife);
}

// ---------- Bewegungserkennung ----------
const video = document.getElementById('video');
const PW = 96, PH = 72, N = PW * PH;
const proc = document.createElement('canvas');
proc.width = PW; proc.height = PH;
const pctx = proc.getContext('2d', { willReadFrequently: true });
const vorschauBox = document.getElementById('vorschauBox');
const vorschauInfo = document.getElementById('vorschauInfo');
const vorschau = document.getElementById('vorschau');
const vctx = vorschau.getContext('2d');
const vorschauBild = vctx.createImageData(PW, PH);

let hg = null, lernen = 0, schwelle = 26;
const aktuell = new Float32Array(N);
const bewegt = new Uint8Array(N);
const sauber = new Uint8Array(N);
const tmp = new Uint8Array(N);
const breit = new Uint8Array(N);
const label = new Int32Array(N);
const stapel = new Int32Array(N);
const vorher = new Float32Array(N);
const schnell = new Uint8Array(N);     // was sich seit dem letzten Bild bewegt hat
const spur = new Float32Array(N);      // nachglühende Handspur
let vorherGueltig = false;
let kameraLaeuft = false;

function neuLernen() { lernen = 12; spuren = []; }

// Bewegte Bereiche zu Personen-Klumpen zusammenfassen
function findeKlumpen() {
  // Ausdehnen (Radius 2), damit Kopf, Arme und Körper einer Person zusammenhängen
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    let v = 0;
    for (let k = -2; k <= 2 && !v; k++) { const xx = x + k; if (xx >= 0 && xx < PW && sauber[y * PW + xx]) v = 1; }
    tmp[y * PW + x] = v;
  }
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    let v = 0;
    for (let k = -2; k <= 2 && !v; k++) { const yy = y + k; if (yy >= 0 && yy < PH && tmp[yy * PW + x]) v = 1; }
    breit[y * PW + x] = v;
  }
  label.fill(0);
  const klumpen = [];
  let nr = 0;
  for (let i = 0; i < N; i++) {
    if (!breit[i] || label[i]) continue;
    nr++;
    let sp = 0; stapel[sp++] = i; label[i] = nr;
    let n = 0, sx = 0, x0 = PW, x1 = -1, y0 = PH, y1 = -1;
    while (sp) {
      const j = stapel[--sp];
      const x = j % PW, y = (j / PW) | 0;
      if (sauber[j]) {
        n++; sx += x;
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      if (x > 0 && breit[j - 1] && !label[j - 1]) { label[j - 1] = nr; stapel[sp++] = j - 1; }
      if (x < PW - 1 && breit[j + 1] && !label[j + 1]) { label[j + 1] = nr; stapel[sp++] = j + 1; }
      if (y > 0 && breit[j - PW] && !label[j - PW]) { label[j - PW] = nr; stapel[sp++] = j - PW; }
      if (y < PH - 1 && breit[j + PW] && !label[j + PW]) { label[j + PW] = nr; stapel[sp++] = j + PW; }
    }
    if (n > N * 0.005) {
      klumpen.push({
        x: sx / n / PW,
        y: (y0 + (y1 - y0) * 0.22) / PH,     // oberer Teil ~ Kopf
        w: (x1 - x0 + 1) / PW,
        flaeche: n / N,
        box: [x0, y0, x1 - x0 + 1, y1 - y0 + 1]
      });
    }
  }
  klumpen.sort((a, b) => b.flaeche - a.flaeche);
  return klumpen.slice(0, 5);
}

function analysiere() {
  if (!kameraLaeuft) return;
  if (video.readyState >= 2) {
    pctx.drawImage(video, 0, 0, PW, PH);
    const d = pctx.getImageData(0, 0, PW, PH).data;
    for (let i = 0, p = 0; i < N; i++, p += 4)
      aktuell[i] = d[p] * 0.299 + d[p + 1] * 0.587 + d[p + 2] * 0.114;
    if (!hg) { hg = new Float32Array(aktuell); lernen = 12; }

    let nSchnell = 0;
    for (let i = 0; i < N; i++) {
      const b = vorherGueltig && Math.abs(aktuell[i] - vorher[i]) > 22 ? 1 : 0;
      schnell[i] = b; nSchnell += b;
    }
    if (nSchnell > N * 0.6) schnell.fill(0);   // Kamera gewackelt / Licht
    vorher.set(aktuell);
    vorherGueltig = true;
    for (let i = 0; i < N; i++) spur[i] = Math.max(spur[i] * 0.6, schnell[i]);
    if (spiel.zustand === 'laeuft') spielBewegung();

    let roh = 0;
    for (let i = 0; i < N; i++) {
      const b = Math.abs(aktuell[i] - hg[i]) > schwelle ? 1 : 0;
      bewegt[i] = b; roh += b;
    }
    sauber.fill(0);
    const jetzt = performance.now();

    if (lernen > 0) {
      lernen--;
      hg.set(aktuell);
      gesamtBewegung = 0;
    } else if (roh > N * 0.55) {
      hg.set(aktuell);              // Licht hat sich geändert oder das Handy wurde bewegt
      gesamtBewegung = 0;
    } else {
      let n = 0;
      for (let y = 1; y < PH - 1; y++) for (let x = 1; x < PW - 1; x++) {
        const i = y * PW + x;
        if (bewegt[i] && bewegt[i - 1] + bewegt[i + 1] + bewegt[i - PW] + bewegt[i + PW] >= 3) { sauber[i] = 1; n++; }
      }
      gesamtBewegung = n / N;
      spurenAktualisieren(findeKlumpen(), jetzt);
      for (let i = 0; i < N; i++)
        hg[i] += (aktuell[i] - hg[i]) * (bewegt[i] ? 0.004 : 0.05);
    }

    if (vorschauBox.classList.contains('an')) zeichneVorschau(jetzt);
  }
  setTimeout(analysiere, spiel.zustand === 'aus' ? 66 : 33);
}

function zeichneVorschau(jetzt) {
  const o = vorschauBild.data;
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    const v = aktuell[i] * 0.8;
    o[p] = sauber[i] ? 255 : v; o[p + 1] = sauber[i] ? 120 : v; o[p + 2] = sauber[i] ? 20 : v; o[p + 3] = 255;
  }
  vctx.putImageData(vorschauBild, 0, 0);
  const aktiv = aktiveSpuren(jetzt);
  vctx.lineWidth = 1;
  for (const sp of aktiv) {
    const [x, y, w, h] = sp.box;
    vctx.strokeStyle = sp.id === fokusId ? '#ffc163' : 'rgba(255,255,255,0.7)';
    vctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }
  const n = aktiv.length;
  vorschauInfo.textContent = (n === 0 ? 'Niemand erkannt' : n === 1 ? '1 Person' : n + ' Personen')
    + ' · Nähe ' + Math.round(naehe * 100) + ' %';
}

async function kameraStarten() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nicht unterstützt');
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play().catch(() => {});
  kameraLaeuft = true;
  hg = null;
  analysiere();
  gestenStarten();
}

// ---------- Bildschirm wach halten ----------
let gestartet = false;
async function wachHalten() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {

});

// ---------- Hinweise ----------
const hinweis = document.getElementById('hinweis');
let hinweisTimer = null;
function zeige(text, ms = 3200) {

// ---------- Start ----------
const start = document.getElementById('start');
async function vollbild() {

  try {
    if (!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
    else if (document.fullscreenElement) await document.exitFullscreen();

  } else {

}
document.getElementById('losKamera').addEventListener('click', () => los(true));
document.getElementById('losFinger').addEventListener('click', () => los(false));

// ---------- Einstellungsleiste ----------
const leiste = document.getElementById('leiste');
let leisteTimer = null;
function leisteZeigen(an) {
  leiste.classList.toggle('offen', an);
  leiste.setAttribute('aria-hidden', an ? 'false' : 'true');
  clearTimeout(leisteTimer);
  if (an) leisteTimer = setTimeout(() => leisteZeigen(false), 8000);

['pointerdown', 'input', 'scroll'].forEach(ev =>
  leiste.addEventListener(ev, e => { e.stopPropagation(); leisteZeigen(true); }, { passive: true }));

// ---------- Berührung: ziehen = Augen führen, tippen = Einstellungen,
//            doppelt tippen = blinzeln, zwei Finger = zoomen / verschieben ----------
const zeiger = new Map();
let down = null, pinch = null, pinchAktiv = false;
let letzterTipp = 0, tippTimer = null;

function fingerPos(e) {
  return {
    x: klemm((e.clientX / innerWidth - 0.5) * 2.4, -1, 1),
    y: klemm((e.clientY / innerHeight - 0.5) * 3, -1, 1)
  };
}
function pinchDaten() {
  const [a, b] = [...zeiger.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y), my: (a.y + b.y) / 2 };
}
let halteTimer = null;
function halteAbbrechen() { clearTimeout(halteTimer); halteTimer = null; }
buehne.addEventListener('contextmenu', e => e.preventDefault());
buehne.addEventListener('pointerdown', e => {
  if (!gestartet) return;
  if (spiel.zustand !== 'aus') {
    if (spiel.zustand === 'laeuft') {
      const dpr = buehne.width / innerWidth;
      patschBei(e.clientX * dpr, e.clientY * dpr);
    }
    return;
  }
  zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
  halteAbbrechen();
  if (zeiger.size === 1) halteTimer = setTimeout(() => {
    if (down && !down.gezogen) { down = null; finger = null; spielVorbereiten(); }
  }, 1600);
  buehne.setPointerCapture(e.pointerId);
  if (zeiger.size === 2) {
    const p = pinchDaten();
    pinch = { d0: Math.max(20, p.d), y0: p.my, z0: S.zoom, h0: S.hoehe };
    pinchAktiv = true; down = null; finger = null; halteAbbrechen();
  } else if (zeiger.size === 1) {
    down = { x: e.clientX, y: e.clientY, gezogen: false };
  }
});
buehne.addEventListener('pointermove', e => {
  if (!zeiger.has(e.pointerId)) return;
  zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && zeiger.size >= 2) {
    const p = pinchDaten();
    setzeZoom(pinch.z0 * p.d / pinch.d0);
    setzeHoehe(pinch.h0 + (p.my - pinch.y0) / (innerHeight * 0.35));
    return;
  }
  if (!down) return;
  if (!down.gezogen && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) { down.gezogen = true; halteAbbrechen(); }
  if (down.gezogen) finger = fingerPos(e);
});
function zeigerWeg(e, abgebrochen) {
  zeiger.delete(e.pointerId);
  halteAbbrechen();
  if (pinchAktiv) {
    if (zeiger.size < 2) pinch = null;
    if (zeiger.size === 0) pinchAktiv = false;
    return;
  }
  if (!abgebrochen && down && !down.gezogen) {
    const jetzt = performance.now();
    if (jetzt - letzterTipp < 300) {
      clearTimeout(tippTimer);
      letzterTipp = 0;
      blinzeln();
    } else {
      letzterTipp = jetzt;
      tippTimer = setTimeout(() => leisteZeigen(!leiste.classList.contains('offen')), 300);
    }
  }
  down = null; finger = null;
}
buehne.addEventListener('pointerup', e => zeigerWeg(e, false));
buehne.addEventListener('pointercancel', e => zeigerWeg(e, true));
buehne.addEventListener('wheel', e => {
  e.preventDefault();
  setzeZoom(S.zoom * Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

// ---------- Regler und Knöpfe ----------
const rZoom = document.getElementById('rZoom'), oZoom = document.getElementById('oZoom');
const rHoehe = document.getElementById('rHoehe'), oHoehe = document.getElementById('oHoehe');

function setzeZoom(z) {

}
rZoom.addEventListener('input', () => setzeZoom(rZoom.value / 100));

function schalter(id, schluessel, textAn, textAus) {

schalter('bMehrere', 'mehrere', 'Mehrere Personen: an – die Augen mustern alle nacheinander.',

const bVorschau = document.getElementById('bVorschau');
bVorschau.addEventListener('click', () => {
  const an = !vorschauBox.classList.contains('an');
  vorschauBox.classList.toggle('an', an);
  bVorschau.setAttribute('aria-pressed', String(an));
  if (an && !kameraLaeuft) zeige('Die Kamera ist nicht aktiv.', 2000);
});
document.getElementById('bBlinzeln').addEventListener('click', () => blinzeln());
document.getElementById('bMotiv').addEventListener('click', () => motivSetzen(S.motiv + 1));
document.getElementById('bNeu').addEventListener('click', () => { neuLernen(); zeige('Kurz stillhalten …', 1800); });
document.getElementById('bVoll').addEventListener('click', vollbild);

setzeZoom(S.zoom); setzeHoehe(S.hoehe); setzeEmpf(S.empf);

// =====================================================================
//  Easter Egg: Spinnenjagd
// =====================================================================
const spiel = { zustand: 'aus', start: 0, ende: 0, punkte: 0, entkommen: 0,
                spinnen: [], flecken: [], naechste: 0, zurueckTimer: null, sperreBis: 0 };
const SPIELZEIT = 30;
const hud = document.getElementById('hud');
const hPunkte = document.getElementById('hPunkte');
const hZeit = document.getElementById('hZeit');
const hZeitFeld = document.getElementById('hZeitFeld');
const countdownEl = document.getElementById('countdown');
const ergebnisEl = document.getElementById('ergebnis');

// --- Klang (kleine synthetische Geräusche, keine Dateien) ---
let audio = null;
function klangStarten() {
  try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
}
function piep(freq, dauer = 0.12, lautst = 0.15, typ = 'square') {
  if (!audio) return;
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = typ; o.frequency.value = freq;
  g.gain.setValueAtTime(lautst, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + dauer);
}
function patschKlang() {
  if (!audio) return;
  const t = audio.currentTime, len = Math.floor(audio.sampleRate * 0.18);
  const buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = audio.createBufferSource(); src.buffer = buf;
  const f = audio.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(250, t + 0.15);
  const g = audio.createGain(); g.gain.value = 0.5;
  src.connect(f).connect(g).connect(audio.destination);
  src.start(t);
  piep(140 + Math.random() * 40, 0.09, 0.12, 'sine');
}

// --- Ablauf ---
function spielVorbereiten() {
  if (spiel.zustand !== 'aus' || performance.now() < spiel.sperreBis) return;
  klangStarten();
  leisteZeigen(false);
  hinweis.classList.remove('an');
  spiel.zustand = 'countdown';
  spiel.spinnen = []; spiel.flecken = [];
  spiel.punkte = 0; spiel.entkommen = 0;
  hPunkte.textContent = '0'; hZeit.textContent = SPIELZEIT; hZeitFeld.classList.remove('knapp');
  blinzeln(true);
  const schritte = [['Spinnen!', 1300, 'text'], ['3', 800], ['2', 800], ['1', 800]];
  let i = 0;
  const weiter = () => {
    if (spiel.zustand !== 'countdown') return;
    if (i < schritte.length) {
      const [txt, ms, cls] = schritte[i++];
      countdownEl.textContent = txt;
      countdownEl.className = cls || '';
      countdownEl.hidden = false;
      piep(i === 1 ? 330 : 520, 0.15, 0.12);
      setTimeout(weiter, ms);
    } else {
      countdownEl.hidden = true;
      piep(880, 0.25, 0.14);
      spielLos();
    }
  };
  weiter();
}
function spielLos() {
  spiel.zustand = 'laeuft';
  spiel.start = performance.now();
  spiel.ende = spiel.start + SPIELZEIT * 1000;
  spiel.naechste = spiel.start;
  hud.hidden = false;
}
function spielEnde() {
  spiel.zustand = 'ergebnis';
  hud.hidden = true;
  const neuerRekord = spiel.punkte > (S.rekord || 0);
  if (neuerRekord) { S.rekord = spiel.punkte; speichern(); }
  document.getElementById('eZahl').textContent = spiel.punkte;
  document.getElementById('eText').textContent =
    (spiel.punkte === 1 ? 'Spinne erwischt' : 'Spinnen erwischt') + ', ' + spiel.entkommen + ' entkommen. '
    + (neuerRekord ? 'Neuer Rekord!' : 'Rekord: ' + S.rekord + '.');
  ergebnisEl.hidden = false;
  piep(neuerRekord ? 660 : 300, 0.4, 0.14, 'triangle');
  clearTimeout(spiel.zurueckTimer);
  spiel.zurueckTimer = setTimeout(spielVerlassen, 20000);
}
function spielVerlassen() {
  clearTimeout(spiel.zurueckTimer);
  ergebnisEl.hidden = true;
  countdownEl.hidden = true;
  hud.hidden = true;
  spiel.zustand = 'aus';
  spiel.spinnen = []; spiel.flecken = [];
  spiel.sperreBis = performance.now() + 5000;   // nicht sofort wieder auslösen
}
document.getElementById('eNochmal').addEventListener('click', () => {
  ergebnisEl.hidden = true; clearTimeout(spiel.zurueckTimer);
  spiel.zustand = 'aus'; spiel.sperreBis = 0; spielVorbereiten();
});
document.getElementById('eZurueck').addEventListener('click', spielVerlassen);

// --- Spinnen ---
function neueSpinne(t) {
  const W = buehne.width, H = buehne.height, U = Math.min(W, H);
  const fortschritt = (t - spiel.start) / (SPIELZEIT * 1000);
  const gold = Math.random() < 0.07;
  const groesse = U * (gold ? 0.075 : 0.06 + Math.random() * 0.045);
  const x0 = groesse + Math.random() * (W - 2 * groesse);
  spiel.spinnen.push({
    x: x0, x0, y: -groesse * 1.5, groesse, gold,
    vy: H * (0.1 + fortschritt * 0.13 + Math.random() * 0.06) * (gold ? 1.5 : 1),
    amp: Math.random() * U * 0.08, freq: 0.6 + Math.random() * 1.4, ph: Math.random() * 6.28,
    faden: !gold && Math.random() < 0.3,
    gang: Math.random() * 6.28, winkel: Math.PI / 2, geboren: t
  });
}

function spinneImBlick() {
  let tief = null;
  for (const s of spiel.spinnen) if (s.y > 0 && (!tief || s.y > tief.y)) tief = s;
  return tief;
}

function treffer(s, t) {
  spiel.spinnen.splice(spiel.spinnen.indexOf(s), 1);
  const wert = s.gold ? 3 : 1;
  spiel.punkte += wert;
  hPunkte.textContent = spiel.punkte;
  const tropfen = [];
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * 6.28, r = s.groesse * (0.5 + Math.random() * 0.9);
    tropfen.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, r: s.groesse * (0.06 + Math.random() * 0.12) });
  }
  spiel.flecken.push({ x: s.x, y: s.y, groesse: s.groesse, winkel: s.winkel, t0: t, gold: s.gold, wert, tropfen });
  patschKlang();
  try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
}

// Finger-Patscher
function patschBei(px, py) {
  const t = performance.now();
  for (let i = spiel.spinnen.length - 1; i >= 0; i--) {
    const s = spiel.spinnen[i];
    if (Math.hypot(s.x - px, s.y - py) < s.groesse * 1.2) { treffer(s, t); return; }
  }
}

// Hand-Patscher über Bewegungserkennung: bewegt sich genug an der Stelle der Spinne?
function spielBewegung() {
  const W = buehne.width, H = buehne.height, t = performance.now();
  for (let i = spiel.spinnen.length - 1; i >= 0; i--) {
    const s = spiel.spinnen[i];
    if (s.y < 0) continue;
    let nx = s.x / W;
    if (S.spiegeln) nx = 1 - nx;
    const cx = nx * PW, cy = (s.y / H) * PH;
    const rx = Math.max(2, s.groesse / W * PW * 0.9), ry = Math.max(2, s.groesse / H * PH * 0.9);
    let n = 0, ges = 0;
    for (let y = Math.max(0, Math.floor(cy - ry)); y <= Math.min(PH - 1, Math.ceil(cy + ry)); y++)
      for (let x = Math.max(0, Math.floor(cx - rx)); x <= Math.min(PW - 1, Math.ceil(cx + rx)); x++) {
        ges++; n += schnell[y * PW + x];
      }
    if (ges && n / ges > 0.3) treffer(s, t);
  }
}

// Handspur als glühende Fläche
const spurCanvas = document.createElement('canvas');
spurCanvas.width = PW; spurCanvas.height = PH;
const spurCtx = spurCanvas.getContext('2d');
const spurBild = spurCtx.createImageData(PW, PH);

function zeichneSpinne(g, s, t) {
  const z = s.groesse;
  g.save();
  g.translate(s.x, s.y);
  // weicher Glutschein, damit die Spinne sich vom Schwarz abhebt
  const schein = g.createRadialGradient(0, 0, 0, 0, 0, z * 1.1);
  schein.addColorStop(0, s.gold ? 'rgba(255,200,80,0.35)' : 'rgba(240,110,30,0.26)');
  schein.addColorStop(1, 'rgba(240,110,30,0)');
  g.fillStyle = schein;
  g.beginPath(); g.arc(0, 0, z * 1.1, 0, 6.283); g.fill();
  g.rotate(s.winkel - Math.PI / 2);   // Kopf zeigt in Laufrichtung (nach unten)
  // Beine: 4 je Seite, abwechselnd im Takt
  g.strokeStyle = s.gold ? '#8a6216' : '#4a3424';
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.lineWidth = Math.max(1.5, z * 0.07);
  for (let seite = -1; seite <= 1; seite += 2) {
    for (let k = 0; k < 4; k++) {
      const takt = Math.sin(s.gang + k * Math.PI / 2 + (seite > 0 ? Math.PI : 0));
      const basisWinkel = (-0.9 + k * 0.6) + takt * 0.22;
      const ax = seite * z * 0.18, ay = z * (0.12 - k * 0.08);
      const kx = ax + seite * Math.cos(basisWinkel) * z * 0.55;
      const ky = ay + Math.sin(basisWinkel) * z * 0.55 - z * 0.18;
      const fx = kx + seite * Math.cos(basisWinkel + 0.9) * z * 0.5;
      const fy = ky + Math.sin(basisWinkel + 0.9) * z * 0.6 + z * 0.12;
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(kx, ky); g.lineTo(fx, fy); g.stroke();
    }
  }
  // Hinterleib
  const koerper = s.gold ? '#c99a2e' : '#1c130d';
  g.fillStyle = koerper;
  g.beginPath(); g.ellipse(0, -z * 0.32, z * 0.3, z * 0.38, 0, 0, 6.283); g.fill();
  g.strokeStyle = s.gold ? 'rgba(255,230,150,0.6)' : 'rgba(240,138,36,0.45)';
  g.lineWidth = Math.max(1, z * 0.03);
  g.stroke();
  // Muster auf dem Rücken
  g.fillStyle = s.gold ? '#ffe08a' : 'rgba(240,138,36,0.55)';
  g.beginPath(); g.ellipse(0, -z * 0.38, z * 0.06, z * 0.16, 0, 0, 6.283); g.fill();
  // Vorderkörper + Kopf
  g.fillStyle = koerper;
  g.beginPath(); g.ellipse(0, z * 0.12, z * 0.2, z * 0.2, 0, 0, 6.283); g.fill();
  // glühende Äuglein
  g.fillStyle = '#ff3b1a';
  g.shadowColor = '#ff3b1a'; g.shadowBlur = z * 0.15;
  g.beginPath(); g.arc(-z * 0.07, z * 0.25, z * 0.04, 0, 6.283); g.arc(z * 0.07, z * 0.25, z * 0.04, 0, 6.283); g.fill();
  g.restore();
}

function zeichneFleck(g, f, t) {
  const alter = (t - f.t0) / 1000;
  const a = Math.max(0, 1 - alter / 1.4);
  if (a <= 0) return false;
  const z = f.groesse;
  g.save();
  g.globalAlpha = a;
  g.translate(f.x, f.y);
  g.fillStyle = f.gold ? '#f2c94c' : '#a6c834';
  for (const d of f.tropfen) { g.beginPath(); g.arc(d.x, d.y, d.r, 0, 6.283); g.fill(); }
  g.fillStyle = f.gold ? '#8a5a0a' : '#2a1d12';
  g.beginPath(); g.ellipse(0, 0, z * 0.45, z * 0.32, f.winkel, 0, 6.283); g.fill();
  g.strokeStyle = g.fillStyle; g.lineWidth = Math.max(1.5, z * 0.06); g.lineCap = 'round';
  for (let k = 0; k < 8; k++) {
    const w = f.winkel + k * 0.785 + 0.3;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(w) * z * 0.8, Math.sin(w) * z * 0.8); g.stroke();
  }
  // „+1“ steigt auf
  g.globalAlpha = a;
  g.fillStyle = '#ffc163';
  g.font = '700 ' + Math.round(z * 0.7) + 'px "Grenze Gotisch", Georgia, serif';
  g.textAlign = 'center';
  g.fillText('+' + f.wert, 0, -z * 0.8 - alter * z * 1.2);
  g.restore();
  return true;
}

function spielSchritt(t, dt) {
  const W = buehne.width, H = buehne.height;
  // Augen abdunkeln, damit die Spinnen gut zu sehen sind
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.fillRect(0, 0, W, H);

  // Handspur (nur mit Kamera)
  if (kameraLaeuft) {
    const o = spurBild.data;
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const v = spur[i];
      o[p] = 255; o[p + 1] = 120 + 80 * v; o[p + 2] = 30; o[p + 3] = v * 110;
    }
    spurCtx.putImageData(spurBild, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    if (S.spiegeln) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(spurCanvas, 0, 0, W, H);
    ctx.restore();
  }

  if (spiel.zustand === 'laeuft') {
    const rest = Math.max(0, spiel.ende - t);
    hZeit.textContent = Math.ceil(rest / 1000);
    hZeitFeld.classList.toggle('knapp', rest < 6000);
    if (t >= spiel.naechste) {
      neueSpinne(t);
      const f = (t - spiel.start) / (SPIELZEIT * 1000);
      spiel.naechste = t + (750 - 480 * f) * (0.6 + Math.random() * 0.8);
    }
    for (let i = spiel.spinnen.length - 1; i >= 0; i--) {
      const s = spiel.spinnen[i];
      const tempo = s.faden ? 0.3 + 0.7 * Math.abs(Math.sin((t - s.geboren) / 600 + s.ph)) : 1;
      const altX = s.x, altY = s.y;
      s.y += s.vy * tempo * dt;
      s.x = s.x0 + Math.sin((t - s.geboren) / 1000 * s.freq + s.ph) * s.amp;
      const vx = s.x - altX, vy = s.y - altY;
      if (Math.hypot(vx, vy) > 0.01) s.winkel += (Math.atan2(vy, vx) - s.winkel) * 0.2;
      s.gang += dt * 14 * tempo;
      if (s.y - s.groesse > H) { spiel.spinnen.splice(i, 1); spiel.entkommen++; }
    }
    if (rest <= 0) spielEnde();
  }

  // Fäden
  ctx.strokeStyle = 'rgba(228,217,203,0.35)';
  ctx.lineWidth = Math.max(1, W / 500);
  for (const s of spiel.spinnen) if (s.faden) {
    ctx.beginPath(); ctx.moveTo(s.x, 0); ctx.lineTo(s.x, s.y - s.groesse * 0.6); ctx.stroke();
  }
  spiel.flecken = spiel.flecken.filter(f => zeichneFleck(ctx, f, t));
  for (const s of spiel.spinnen) zeichneSpinne(ctx, s, t);
}

// =====================================================================
//  Handgesten-Erkennung (Peace-Zeichen startet die Spinnenjagd)
// =====================================================================
const MP_VERSION = '0.10.21';
const MP_BASIS = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VERSION;
const MP_MODELL = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';
let gesten = null, gestenLaedt = false, peaceZaehler = 0, letzterGestenZeitstempel = 0;

async function gestenStarten() {
  if (gestenLaedt) return;
  gestenLaedt = true;
  try {
    const mp = await import(MP_BASIS + '/vision_bundle.mjs');
    const dateien = await mp.FilesetResolver.forVisionTasks(MP_BASIS + '/wasm');
    const optionen = delegate => ({
      baseOptions: { modelAssetPath: MP_MODELL, delegate },
      runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
    });
    try { gesten = await mp.GestureRecognizer.createFromOptions(dateien, optionen('GPU')); }
    catch (e) { gesten = await mp.GestureRecognizer.createFromOptions(dateien, optionen('CPU')); }
    gestenSchleife();
  } catch (e) {
    console.warn('Gestenerkennung nicht verfügbar:', e);
  }
}

function gestenSchleife() {
  try {
    if (gesten && kameraLaeuft && spiel.zustand === 'aus' && video.readyState >= 2
        && performance.now() > spiel.sperreBis && !document.hidden) {
      const ts = Math.max(performance.now(), letzterGestenZeitstempel + 1);
      letzterGestenZeitstempel = ts;
      const r = gesten.recognizeForVideo(video, ts);
      const peace = (r.gestures || []).some(g => g[0] && g[0].categoryName === 'Victory' && g[0].score > 0.6);
      peaceZaehler = peace ? peaceZaehler + 1 : Math.max(0, peaceZaehler - 1);
      if (peaceZaehler >= 3) { peaceZaehler = 0; spielVorbereiten(); }
    }
  } catch (e) { console.warn(e); }
  setTimeout(gestenSchleife, 180);
}

// ---------- Los geht’s ----------
Promise.all(A.motive.map(m =>
  Promise.all([bild(m.bg), bild(m.mask), bild(m.lidmask), bild(m.shadow), ...m.iris.map(i => bild(i.src))])
    .then(([bg, mask, lidmask, shadow, ...iris]) => ({ bg, mask, lidmask, shadow, iris }))
)).then(alle => {
  alle.forEach((g, i) => GELADEN[i] = g);
  motivSetzen(S.motiv);
  requestAnimationFrame(schleife);
});
